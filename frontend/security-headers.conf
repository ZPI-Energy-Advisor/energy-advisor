# Nagłówki bezpieczeństwa (ZP-134), dołączane w każdym bloku location.
# W nginx add_header w bloku location kasuje nagłówki z poziomu server, dlatego include zamiast jednego wpisu.
# __API_ORIGIN__ podstawia Dockerfile przy budowie obrazu (origin z VITE_API_URL).
# Google Sign-In (@react-oauth/google): skrypt, iframe i style z accounts.google.com/gsi, zdjęcie profilu z googleusercontent.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' __API_ORIGIN__ https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://*.googleusercontent.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
