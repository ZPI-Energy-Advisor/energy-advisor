server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pliki z hashem w nazwie (Vite) można cache'ować długo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html bez cache, żeby po nowym buildzie przeglądarka pobrała nowe assety
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # API pod tym samym adresem co aplikacja: frontend pyta o /api/v1, a nginx przekazuje to do backendu.
    # Dzięki temu aplikacja działa pod localhost, pod IP komputera w sieci domowej (telefon) i na serwerze
    # z HTTPS bez zmiany adresu API i bez CORS. X-Real-IP niesie adres klienta do limitów logowania.
    location /api/ {
        # Adres backendu z DNS Dockera przy zapytaniu (zmienna), a nie przy starcie: nginx wstaje także wtedy,
        # gdy backend akurat się restartuje.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Import pliku do 10 MB (MAX_FILE_SIZE_MB) z zapasem; dłuższe liczenie planu i optymalizacji.
        client_max_body_size 12m;
        proxy_read_timeout 180s;
    }

    # PWA: service worker i manifest bez cache, żeby telefon od razu zobaczył nową wersję aplikacji
    # (pliki aplikacji trzyma service worker, który sam porównuje wersje).
    location ~ ^/(sw\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Fallback SPA: odświeżenie podstrony (np. /dashboard) zwraca index.html, routing robi React Router
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
