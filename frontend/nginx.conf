server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pliki z hashem w nazwie (Vite) można cache'ować długo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html bez cache, żeby po nowym buildzie przeglądarka pobrała nowe assety
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Fallback SPA: odświeżenie podstrony (np. /dashboard) zwraca index.html, routing robi React Router
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
