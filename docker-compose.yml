services:
  db:
    image: postgres:15
    container_name: energy_advisor_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: energy_advisor_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - REFRESH_TOKEN_EXPIRATION_DAYS=${REFRESH_TOKEN_EXPIRATION_DAYS}
      - ACCESS_TOKEN_EXPIRATION_MINUTES=${ACCESS_TOKEN_EXPIRATION_MINUTES}
      - SIGNATURE_ALGORITHM=${SIGNATURE_ALGORITHM}
      - PRICE_SYNC_ADMIN_KEY=${PRICE_SYNC_ADMIN_KEY:-}
      - HUB_URL=${HUB_URL:-}
      - HUB_API_KEY=${HUB_API_KEY:-}
      - HUB_TIMEOUT_SECONDS=${HUB_TIMEOUT_SECONDS:-5}
      - HUB_HOME_USER_EMAIL=${HUB_HOME_USER_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  price-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: energy_advisor_price_worker
    restart: always
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.workers.price_sync_worker run

  hub:
    build: ./smart-home-hub
    container_name: energy_advisor_hub
    restart: always
    environment:
      - HUB_API_KEY=${HUB_API_KEY:-}
    volumes:
      - hub_data:/data

volumes:
  postgres_data:
  hub_data: