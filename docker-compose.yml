services:
  db:
    image: postgres:15
    container_name: energy_advisor_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: energy_advisor_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Przykładowe pliki z frontendu, z których korzystają testy backendu (pytest tests/ w kontenerze).
      - ./frontend/public/samples:/frontend/public/samples:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - REFRESH_TOKEN_EXPIRATION_DAYS=${REFRESH_TOKEN_EXPIRATION_DAYS}
      - ACCESS_TOKEN_EXPIRATION_MINUTES=${ACCESS_TOKEN_EXPIRATION_MINUTES}
      - SIGNATURE_ALGORITHM=${SIGNATURE_ALGORITHM}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_LOGIN=${RATE_LIMIT_LOGIN:-5/minute}
      - RATE_LIMIT_REGISTER=${RATE_LIMIT_REGISTER:-3/hour}
      - RATE_LIMIT_ADDRESS_LOOKUP=${RATE_LIMIT_ADDRESS_LOOKUP:-20/minute}
      - PRICE_SYNC_ADMIN_KEY=${PRICE_SYNC_ADMIN_KEY:-}
      - HUB_URL=${HUB_URL:-}
      - HUB_API_KEY=${HUB_API_KEY:-}
      - HUB_TIMEOUT_SECONDS=${HUB_TIMEOUT_SECONDS:-5}
      - HUB_HOME_USER_EMAIL=${HUB_HOME_USER_EMAIL:-}
      - PRICE_PUBLICATION_TIME=${PRICE_PUBLICATION_TIME:-15:00}
      - FLAT_PRICE_SPREAD_PLN_KWH=${FLAT_PRICE_SPREAD_PLN_KWH:-0.05}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  price-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: energy_advisor_price_worker
    restart: always
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PRICE_PUBLICATION_TIME=${PRICE_PUBLICATION_TIME:-15:00}
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.workers.price_sync_worker run

  weather-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: energy_advisor_weather_worker
    restart: always
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - GEOCODER_USER_AGENT=${GEOCODER_USER_AGENT:-}
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.workers.weather_worker run

  frontend:
    build:
      context: ./frontend
      args:
        # Vite wpisuje te wartości w kod przy buildzie: po zmianie w .env trzeba przebudować obraz
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    container_name: energy_advisor_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  hub:
    build: ./smart-home-hub
    container_name: energy_advisor_hub
    restart: always
    environment:
      - HUB_API_KEY=${HUB_API_KEY:-}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    volumes:
      - hub_data:/data

volumes:
  postgres_data:
  hub_data: